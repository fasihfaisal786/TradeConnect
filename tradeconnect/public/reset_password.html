<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — TradeConnect</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#000;color:#fff;min-height:100vh;display:flex;flex-direction:column;}
nav{background:#0a0a0a;border-bottom:1px solid #1e1e1e;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-weight:800;font-size:1.4rem;color:#fff;text-decoration:none;}
.logo span{color:#3bcc6e;}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px;}
.box{background:#0f0f0f;border:1px solid #1e1e1e;border-radius:20px;padding:44px;width:100%;max-width:480px;}
h2{font-weight:800;font-size:1.8rem;color:#fff;margin-bottom:8px;}
.sub{color:#555;margin-bottom:28px;font-size:.9rem;line-height:1.6;}
.form-group{margin-bottom:16px;}
label{display:block;font-weight:600;font-size:.85rem;color:#aaa;margin-bottom:7px;}
input,select{width:100%;background:#111;border:1px solid #222;color:#fff;border-radius:9px;padding:13px 14px;font-family:'Inter',sans-serif;font-size:.9rem;outline:none;transition:border .2s;}
input::placeholder{color:#444;}
input:focus,select:focus{border-color:#3bcc6e;}
select option{background:#111;color:#fff;}
.btn{background:#3bcc6e;color:#000;border:none;width:100%;padding:14px;border-radius:10px;font-weight:700;font-size:1rem;cursor:pointer;font-family:'Inter',sans-serif;transition:.2s;margin-top:8px;}
.btn:hover{background:#2aaa58;}
.alert{border-radius:9px;padding:12px 16px;margin-bottom:16px;font-size:.88rem;display:none;}
.alert.show{display:block;}
.alert-error{background:#1a0a0a;border:1px solid #3a1a1a;color:#ff6b6b;}
.alert-success{background:#0d1f14;border:1px solid #1a3a24;color:#3bcc6e;}
.back-link{text-align:center;margin-top:20px;font-size:.88rem;color:#555;}
.back-link a{color:#3bcc6e;font-weight:600;text-decoration:none;}
.step{background:#111;border:1px solid #1e1e1e;border-radius:12px;padding:16px 20px;margin-bottom:16px;}
.step-num{background:#3bcc6e;color:#000;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:.82rem;margin-right:10px;}
.step p{color:#888;font-size:.85rem;margin-top:6px;padding-left:36px;}
</style>
</head>
<body>
<nav>
  <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 4L26 26" stroke="#3bcc6e" stroke-width="3.5" stroke-linecap="round"/><path d="M26 4L4 26" stroke="#3bcc6e" stroke-width="3.5" stroke-linecap="round"/><circle cx="4" cy="4" r="3" fill="#3bcc6e"/><circle cx="26" cy="4" r="3" fill="#3bcc6e"/><circle cx="4" cy="26" r="3" fill="#3bcc6e"/><circle cx="26" cy="26" r="3" fill="#3bcc6e"/></svg><span style="font-family:Inter,sans-serif;font-size:1.25rem;font-weight:800;color:#fff;letter-spacing:-.3px;">Trade <span style="color:#3bcc6e;">Connect</span></span></span></a>
  <a href="login.html" style="color:#555;font-size:.88rem;text-decoration:none;"><i class="fas fa-arrow-left" style="margin-right:6px"></i>Back to Login</a>
</nav>

<div class="main">
  <div class="box">
    <h2><i class="fas fa-key" style="color:#3bcc6e;margin-right:10px"></i>Reset Password</h2>
    <p class="sub">Forgot your email or password? Enter your registered email and set a new password.</p>

    <div class="alert alert-error" id="errBox"><i class="fas fa-exclamation-circle" style="margin-right:8px"></i><span id="errTxt"></span></div>
    <div class="alert alert-success" id="sucBox"><i class="fas fa-check-circle" style="margin-right:8px"></i><span id="sucTxt"></span></div>

    <form onsubmit="resetPassword(event)">
      <div class="form-group">
        <label><i class="fas fa-envelope" style="color:#3bcc6e;margin-right:6px"></i>Your Email Address</label>
        <input type="email" id="emailF" placeholder="Enter your registered email e.g. john@gmail.com" required>
      </div>
      <div class="form-group">
        <label><i class="fas fa-lock" style="color:#3bcc6e;margin-right:6px"></i>New Password</label>
        <input type="password" id="newPass" placeholder="Enter new password (min 6 characters)" required minlength="6">
      </div>
      <div class="form-group">
        <label><i class="fas fa-lock" style="color:#3bcc6e;margin-right:6px"></i>Confirm New Password</label>
        <input type="password" id="confPass" placeholder="Repeat your new password" required minlength="6">
      </div>
      <button type="submit" class="btn"><i class="fas fa-save" style="margin-right:8px"></i>Reset Password</button>
    </form>

    <p class="back-link">Remembered your password? <a href="login.html">Login here</a></p>
  </div>
</div>

<script>
async function resetPassword(e){
  e.preventDefault();
  const email   = document.getElementById('emailF').value.trim();
  const newPass = document.getElementById('newPass').value;
  const conf    = document.getElementById('confPass').value;

  hideAlerts();

  if(newPass !== conf){
    showError('Passwords do not match! Please try again.');
    return;
  }
  if(newPass.length < 6){
    showError('Password must be at least 6 characters long.');
    return;
  }

  const fd = new FormData();
  fd.append('email', email);
  fd.append('new_password', newPass);

  try{
    const res  = await fetch('api/reset_password.php', {method:'POST', body:fd});
    const json = await res.json();
    if(json.ok){
      showSuccess('Password reset successfully! Redirecting to login...');
      document.querySelector('form').reset();
      setTimeout(()=>{ window.location.href='login.html'; }, 2500);
    } else {
      showError(json.msg || 'This email is not registered. Please check and try again.');
    }
  }catch(e){
    showError('Something went wrong. Please try again.');
  }
}

function showError(msg){ document.getElementById('errTxt').textContent=msg; document.getElementById('errBox').classList.add('show'); }
function showSuccess(msg){ document.getElementById('sucTxt').textContent=msg; document.getElementById('sucBox').classList.add('show'); }
function hideAlerts(){ document.getElementById('errBox').classList.remove('show'); document.getElementById('sucBox').classList.remove('show'); }
</script>
</body>
</html>
