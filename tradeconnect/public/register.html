<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register — TradeConnect</title>
<link rel="stylesheet" href="common.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{display:flex;flex-direction:column;min-height:100vh;}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px;}
.box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px;width:100%;max-width:520px;}
.box h2{font-weight:800;font-size:1.8rem;color:#fff;margin-bottom:6px;}
.box .sub{color:var(--muted);margin-bottom:24px;font-size:.9rem;}
.role-tabs{display:flex;background:#111;border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:24px;}
.role-tab{flex:1;padding:10px;border:none;background:transparent;border-radius:8px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;font-size:.9rem;color:var(--muted);transition:.2s;}
.role-tab.active{background:var(--green);color:#000;}
.btn-full{background:var(--green);color:#000;border:none;width:100%;padding:14px;border-radius:10px;font-weight:700;font-size:1rem;cursor:pointer;font-family:'Inter',sans-serif;transition:.2s;margin-top:8px;}
.btn-full:hover{background:var(--green-dark);}
.t-fields{display:none;border-top:1px solid var(--border);margin-top:16px;padding-top:16px;}
.t-fields.show{display:block;}
.t-label{font-size:.85rem;font-weight:700;color:var(--light);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.t-label i{color:var(--green);}
.login-link{text-align:center;margin-top:18px;font-size:.88rem;color:var(--muted);}
.login-link a{color:var(--green);font-weight:600;}
</style>
</head><body>
<nav class="navbar">
  <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 4L26 26" stroke="#3bcc6e" stroke-width="3.5" stroke-linecap="round"/><path d="M26 4L4 26" stroke="#3bcc6e" stroke-width="3.5" stroke-linecap="round"/><circle cx="4" cy="4" r="3" fill="#3bcc6e"/><circle cx="26" cy="4" r="3" fill="#3bcc6e"/><circle cx="4" cy="26" r="3" fill="#3bcc6e"/><circle cx="26" cy="26" r="3" fill="#3bcc6e"/></svg><span style="font-family:Inter,sans-serif;font-size:1.25rem;font-weight:800;color:#fff;letter-spacing:-.3px;">Trade <span style="color:#3bcc6e;">Connect</span></span></span></a>
  <a href="login.html" style="color:var(--muted);font-size:.88rem;"><i class="fas fa-arrow-left" style="margin-right:6px"></i>Login</a>
</nav>
<div class="main">
  <div class="box">
    <h2>Create Account</h2>
    <p class="sub">Join TradeConnect — Pakistan's trusted trades platform</p>
    <div class="alert alert-error show" id="errBox" style="display:none"><span id="errTxt"></span></div>
    <div class="role-tabs">
      <button class="role-tab active" onclick="setRole('client',this)"><i class="fas fa-user" style="margin-right:7px"></i>I'm a Client</button>
      <button class="role-tab" onclick="setRole('tradesman',this)"><i class="fas fa-tools" style="margin-right:7px"></i>I'm a Tradesman</button>
    </div>
    <form action="api/register.php" method="POST" onsubmit="return validate()">
      <input type="hidden" name="role" id="roleInput" value="client">
      <div class="form-group"><label>Full Name</label><input type="text" name="name" placeholder="Your Name" required></div>
      <div class="form-group"><label>Email Address</label><input type="email" name="email" placeholder="you@example.com" required></div>
      <div class="form-group"><label>Phone Number</label><input type="text" name="phone" placeholder="03XX-XXXXXXX"></div>
      <div class="form-group"><label>City</label>
        <select name="city" required><option value="">Select City</option>
        <option>Karachi</option><option>Lahore</option><option>Islamabad</option><option>Rawalpindi</option><option>Faisalabad</option><option>Multan</option><option>Hyderabad</option><option>Peshawar</option></select>
      </div>
      <div class="form-group"><label>Password</label><input type="password" name="password" id="p1" placeholder="Min 6 characters" required></div>
      <div class="form-group"><label>Confirm Password</label><input type="password" name="confirm_password" id="p2" placeholder="Repeat password" required></div>
      <div class="t-fields" id="tFields">
        <div class="t-label"><i class="fas fa-tools"></i>Tradesman Details</div>
        <div class="form-group"><label>Trade Category</label>
          <select name="trade_category"><option value="plumber">🔧 Plumber</option><option value="electrician">⚡ Electrician</option><option value="carpenter">🪚 Carpenter</option><option value="painter">🎨 Painter</option><option value="other">Other</option></select>
        </div>
        <div class="form-group"><label>Years of Experience</label><input type="number" name="experience_years" placeholder="e.g. 5" min="0"></div>
        <div class="form-group"><label>Hourly Rate (Rs.)</label><input type="number" name="hourly_rate" placeholder="e.g. 500" min="0"></div>
        <div class="form-group"><label>Short Bio</label><textarea name="bio" rows="2" placeholder="Tell clients about your skills..."></textarea></div>
      </div>
      <button type="submit" class="btn-full"><i class="fas fa-user-plus" style="margin-right:8px"></i>Create Account</button>
    </form>
    <p class="login-link">Already have an account? <a href="login.html">Login here</a></p>
  </div>
</div>
<script>
function setRole(r,btn){
  document.getElementById('roleInput').value=r;
  document.querySelectorAll('.role-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tFields').classList.toggle('show',r==='tradesman');
}
function validate(){
  if(document.getElementById('p1').value!==document.getElementById('p2').value){
    alert('Passwords do not match!');return false;
  }
  if(document.getElementById('p1').value.length<6){alert('Password min 6 characters!');return false;}
  return true;
}
const p=new URLSearchParams(location.search);
if(p.get('role')==='tradesman')setRole('tradesman',document.querySelectorAll('.role-tab')[1]);
if(p.get('error')){const b=document.getElementById('errBox');document.getElementById('errTxt').textContent=decodeURIComponent(p.get('error').replace(/\+/g,' '));b.style.display='block';}
</script>
</body></html>
