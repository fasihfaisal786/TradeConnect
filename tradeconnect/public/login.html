<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — TradeConnect</title>
<link rel="stylesheet" href="common.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{display:flex;flex-direction:column;min-height:100vh;}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px;}
.box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:44px;width:100%;max-width:420px;}
.box h2{font-weight:800;font-size:1.9rem;color:#fff;margin-bottom:6px;}
.box .sub{color:var(--muted);margin-bottom:28px;font-size:.9rem;}
.forgot{text-align:right;margin-top:-8px;margin-bottom:16px;}
.forgot a{color:var(--green);font-size:.82rem;font-weight:600;}
.btn-full{background:var(--green);color:#000;border:none;width:100%;padding:14px;border-radius:10px;font-weight:700;font-size:1rem;cursor:pointer;font-family:'Inter',sans-serif;transition:.2s;}
.btn-full:hover{background:var(--green-dark);}
.divider{text-align:center;color:#333;margin:20px 0;font-size:.85rem;position:relative;}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:44%;height:1px;background:var(--border);}
.divider::before{left:0;}.divider::after{right:0;}
.demo-wrap{margin-bottom:20px;}
.demo-btn{background:#0d1f14;border:1px solid #1a3a24;color:#3bcc6e;border-radius:8px;padding:9px 18px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:.2s;display:inline-flex;align-items:center;gap:6px;flex-direction:row;}
.demo-btn:hover{background:#142d1c;border-color:#3bcc6e;}
.reg-link{text-align:center;font-size:.88rem;color:var(--muted);}
.reg-link a{color:var(--green);font-weight:600;}
@media(max-width:480px){
  .box{padding:28px 20px;}
  .box h2{font-size:1.6rem;}
  .demo-wrap > div{flex-wrap:wrap!important;gap:6px!important;}
  .demo-btn{flex:1 1 30%;justify-content:center;padding:8px 6px;font-size:.72rem;}
}
</style>
</head><body>
<nav class="navbar">
  <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 4L26 26" stroke="#3bcc6e" stroke-width="3.5" stroke-linecap="round"/><path d="M26 4L4 26" stroke="#3bcc6e" stroke-width="3.5" stroke-linecap="round"/><circle cx="4" cy="4" r="3" fill="#3bcc6e"/><circle cx="26" cy="4" r="3" fill="#3bcc6e"/><circle cx="4" cy="26" r="3" fill="#3bcc6e"/><circle cx="26" cy="26" r="3" fill="#3bcc6e"/></svg><span style="font-family:Inter,sans-serif;font-size:1.25rem;font-weight:800;color:#fff;letter-spacing:-.3px;">Trade <span style="color:#3bcc6e;">Connect</span></span></span></a>
  <a href="index.html" style="color:var(--muted);font-size:.88rem;"><i class="fas fa-arrow-left" style="margin-right:6px"></i>Back</a>
</nav>
<div class="main">
  <div class="box">
    <h2>Welcome Back</h2>
    <p class="sub">Login to your TradeConnect account</p>
    <div class="alert alert-error" id="alertBox"><i class="fas fa-exclamation-circle" style="margin-right:8px"></i><span id="alertTxt"></span></div>
    <div class="alert alert-success" id="successBox"><i class="fas fa-check-circle" style="margin-right:8px"></i>Account created! Login karo.</div>
    <form action="api/login.php" method="POST">
      <div class="form-group"><label>Email Address</label><input type="email" name="email" id="emailF" placeholder="you@example.com" required></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" id="passF" placeholder="Your password" required></div>
      <div class="forgot"><a href="reset_password.html">Forgot password?</a></div>
      <button type="submit" class="btn-full"><i class="fas fa-sign-in-alt" style="margin-right:8px"></i>Login</button>
    </form>
    <div class="divider">or demo accounts</div>
    <div class="demo-wrap">
      <div style="display:flex;gap:8px;justify-content:center;">
        <button class="demo-btn" onclick="fill('admin@tradeconnect.pk','admin123')"><i class="fas fa-cog" style="margin-right:5px"></i>Admin</button>
        <button class="demo-btn" onclick="fill('client@demo.com','demo123')"><i class="fas fa-user" style="margin-right:5px"></i>Client</button>
        <button class="demo-btn" onclick="fill('tradesman@demo.com','demo123')"><i class="fas fa-tools" style="margin-right:5px"></i>Tradesman</button>
      </div>
    </div>
    <p class="reg-link">No account? <a href="register.html">Register here</a></p>
  </div>
</div>
<script>
function fill(e,p){document.getElementById('emailF').value=e;document.getElementById('passF').value=p;}
const p=new URLSearchParams(location.search);
if(p.get('error')){document.getElementById('alertTxt').textContent=decodeURIComponent(p.get('error').replace(/\+/g,' '));document.getElementById('alertBox').classList.add('show');}
if(p.get('registered')){document.getElementById('successBox').classList.add('show');document.getElementById('successBox').innerHTML='<i class="fas fa-check-circle" style="margin-right:8px"></i>Account created successfully! Please login.'}
if(p.get('loggedout')){document.getElementById('successBox').classList.add('show');document.getElementById('successBox').innerHTML='<i class="fas fa-check-circle" style="margin-right:8px"></i>You have been logged out successfully.'}
</script>
</body></html>
